<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lo que habría dicho el sistema</title>
<link rel="stylesheet" href="gridpredic.css">
<style>
  /* Four years in one screen: a calendar per distribuidora and year with the level the system would have given
     the evening before (colour) and the incidents that happened (dots), from historico.json. */
  :root { --cal-bajo: #a9dcb9; --cal-medio: #f2d98a; --cal-alto: #f2b283; --cal-muy-alto: #e27f78; --dot: #1b2430; --bg: var(--paper); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --cal-bajo: #2f6b45; --cal-medio: #8a7420; --cal-alto: #9a5424; --cal-muy-alto: #a63a37; --dot: #ffffff; } }
  :root[data-theme="dark"] { --cal-bajo: #2f6b45; --cal-medio: #8a7420; --cal-alto: #9a5424; --cal-muy-alto: #a63a37; --dot: #ffffff; }
  main, footer, header.page { max-width: 1280px; }
  main section { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-3); box-shadow: var(--shadow); padding: var(--s-4) var(--s-5) var(--s-5); }
  main section h2 { margin: 0 0 var(--s-3); font-size: var(--fs-4); }
  main section h3 { margin: var(--s-4) 0 var(--s-2); font-size: var(--fs-2); }
  .controles { display: flex; gap: var(--s-3) var(--s-4); flex-wrap: wrap; align-items: center; font-size: var(--fs-1); }
  .controles label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  .cifras { margin-top: var(--s-2); }
  .anio { margin: var(--s-3) 0 2px; font-size: var(--fs-1); font-weight: 600; }
  .cal { display: block; width: 100%; height: auto; }
  /* On a phone a year of 53 weeks would leave squares of 5 px: the calendar keeps a readable size and scrolls sideways. */
  .cal-caja { overflow-x: auto; }
  @media (max-width: 640px) { .cal { min-width: 640px; } }
  .leyenda { margin-top: var(--s-2); }
  .leyenda i { border-radius: 2px; }
  .leyenda b.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--dot); margin-right: 4px; }
  .tip { position: fixed; pointer-events: none; background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: var(--r-1);
    padding: 6px 8px; font-size: var(--fs-0); box-shadow: var(--shadow); display: none; max-width: 320px; z-index: 30; }
  p.texto { margin: var(--s-2) 0; max-width: 80ch; }
  td:first-child, th:first-child { position: static; }
  .scroll { max-height: none; }
</style>
</head>
<body>
<nav class="menu" aria-label="Páginas del cuadro de mando">
  <a class="marca" href="index.html" aria-label="GridPredic, riesgo de mañana"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h5l3 4h10" fill="none" stroke="#8fb1ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 12h7l3 4h8" fill="none" stroke="#8fb1ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/><path d="M3 19h4l3-4h11" fill="none" stroke="#8fb1ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/><circle cx="8" cy="5" r="1.8" fill="#ffffff"/><circle cx="10" cy="12" r="1.8" fill="#ffffff"/><circle cx="7" cy="19" r="1.8" fill="#ffffff"/></svg>GridPredic</a>
  <div class="items">
    <a href="index.html">Riesgo de mañana</a>
    <a href="dias.html">Días archivados</a>
    <a href="historial.html" class="actual">Día a día 2022 - 2026</a>
    <a href="negocio.html">Negocio y cifras</a>
  </div>
  <span class="derecha"><a href="dias.html#ayuda">Qué hay en cada página</a><a href="http://localhost:8084" target="_blank" rel="noopener">Airflow</a></span>
</nav>
<header class="page">
  <div class="page-top">
    <div class="titulo"><h1>Lo que habría dicho el sistema, día a día</h1></div>
  </div>
  <p class="sub" id="fuentes">Cargando data/historico.json...</p>
</header>
<main id="main">
  <section>
    <div class="controles">
      <span>Tiempo del día que ve el modelo:</span>
      <label><input type="radio" name="modo" value="prevision" checked> <span>previsión real de ICON-EU de la víspera (<span id="anios-prevision">2024 - 2026</span>)</span></label>
      <label><input type="radio" name="modo" value="reanalisis"> <span>reanálisis, como previsión perfecta (<span id="anios-reanalisis">2022 - 2026</span>)</span></label>
      <label><input type="checkbox" id="winsor"> recortar los cortes de más de 110 minutos (el incendio de Jarilla del 13.08.2025 pesa él solo tanto como un año entero)</label>
    </div>
  </section>
  <div id="bloques"></div>
</main>
<div class="tip" id="tip"></div>
<footer id="pie"></footer>
<script src="vendor/gsap/gsap.min.js"></script>
<script src="vendor/gsap/ScrollTrigger.min.js"></script>
<script src="motion.js"></script>
<script>
(function () {
  "use strict";

  // Every table scrolls inside its own box on narrow screens instead of widening the page.
  function envolverTablas(root) {
    root.querySelectorAll("table").forEach((t) => {
      if (t.closest(".scroll")) return;
      const w = document.createElement("div"); w.className = "scroll"; t.parentNode.insertBefore(w, t); w.appendChild(t);
    });
  }
  const COLORS = { bajo: "var(--cal-bajo)", medio: "var(--cal-medio)", alto: "var(--cal-alto)", "muy alto": "var(--cal-muy-alto)" };
  const ORDER = ["bajo", "medio", "alto", "muy alto"];
  const cls = (n) => (n || "bajo").replace(" ", "-");
  // Numbers in Spanish: decimal comma and a dot every three digits, also with four digits (6.451, not 6451, which is
  // what toLocaleString("es-ES") leaves).
  const num = (x, d = 0) => {
    if (x == null || isNaN(x)) return "";
    const [whole, dec] = Math.abs(Number(x)).toFixed(d).split(".");
    const sign = Number(x) < 0 && Number(Math.abs(Number(x)).toFixed(d)) !== 0 ? "-" : "";
    return sign + whole.replace(/\B(?=(\d{3})+(?!\d))/g, ".") + (dec ? "," + dec : "");
  };
  const pct = (x, d = 0) => (x == null || isNaN(x)) ? "" : num(100 * x, d) + "\u00a0%";
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const fecha = (f) => f.slice(8, 10) + "." + f.slice(5, 7) + "." + f.slice(0, 4);
  const CAP = 110;
  let DATA = null;

  // The cut hours come from the job (chr: every CT cut capped at 110 min); older files only have the raw hours and the longest cut.
  function hours(d, winsor) { return winsor ? (d.chr != null ? d.chr : (d.m > CAP ? d.ch * CAP / d.m : d.ch)) : d.ch; }

  function resumen(days, winsor) {
    const by = {};
    for (const n of ORDER) by[n] = { dias: 0, con: 0, inc: 0, ch: 0 };
    let total = 0;
    for (const d of days) { const b = by[d.n] || by.bajo; b.dias++; if (d.i > 0) b.con++; b.inc += d.i; const h = hours(d, winsor); b.ch += h; total += h; }
    const alert = by.alto.ch + by["muy alto"].ch, alertDays = by.alto.dias + by["muy alto"].dias;
    const worst = days.filter((d) => d.i > 0).map((d) => ({ ...d, h: hours(d, winsor) })).sort((a, b) => b.h - a.h).slice(0, 10);
    return { by, total, alert, alertDays, worst, dias: days.length };
  }

  function calendar(days, year, winsor) {
    const W = 14, G = 2, L = 28, T = 16;
    const first = new Date(year + "-01-01T00:00:00Z"), last = new Date(year + "-12-31T00:00:00Z");
    const offset = (first.getUTCDay() + 6) % 7;
    const weeks = Math.ceil((offset + 366) / 7);
    const width = L + weeks * (W + G) + 4, height = T + 7 * (W + G) + 4;
    const byDate = new Map(days.map((d) => [d.f, d]));
    let out = `<svg class="cal" viewBox="0 0 ${width} ${height}" role="img" aria-label="Calendario de ${year}">`;
    const meses = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
    const dias = ["L", "", "X", "", "V", "", "D"];
    dias.forEach((t, i) => { if (t) out += `<text x="${L - 6}" y="${T + i * (W + G) + W - 3}" font-size="9" text-anchor="end" fill="var(--muted)">${t}</text>`; });
    let maxH = 1;
    for (const d of days) maxH = Math.max(maxH, hours(d, winsor));
    for (let t = new Date(first); t <= last; t.setUTCDate(t.getUTCDate() + 1)) {
      const f = t.toISOString().slice(0, 10);
      const idx = Math.floor((t - first) / 86400000) + offset;
      const col = Math.floor(idx / 7), row = idx % 7;
      const x = L + col * (W + G), y = T + row * (W + G);
      if (t.getUTCDate() === 1) out += `<text x="${x}" y="${T - 5}" font-size="9" fill="var(--muted)">${meses[t.getUTCMonth()]}</text>`;
      const d = byDate.get(f);
      const fill = d ? COLORS[d.n] || COLORS.bajo : "var(--grid)";
      // A day with a warning of AEMET (sent before the evening) gets an outline: thin for yellow, thick for orange or red.
      const warn = d && d.a ? ` stroke="var(--fg)" stroke-width="${d.a >= 2 ? 2 : 1}" stroke-opacity="0.8"` : "";
      out += `<rect x="${x}" y="${y}" width="${W}" height="${W}" rx="2" fill="${fill}"${warn} data-f="${f}" class="dia"></rect>`;
      if (d && d.i > 0) {
        const h = hours(d, winsor);
        const r = 1.6 + 4.4 * Math.sqrt(h / maxH);
        out += `<circle cx="${x + W / 2}" cy="${y + W / 2}" r="${r.toFixed(1)}" fill="var(--dot)" opacity="0.85" pointer-events="none"></circle>`;
      }
    }
    return out + "</svg>";
  }

  function render() {
    if (!DATA) return;
    const mode = document.querySelector('input[name="modo"]:checked').value;
    const winsor = document.getElementById("winsor").checked;
    const root = document.getElementById("bloques");
    root.innerHTML = "";
    for (const dist of DATA.distribuidoras) {
      const days = dist.dias[mode] || [];
      if (!days.length) continue;
      const r = resumen(days, winsor);
      const years = [...new Set(days.map((d) => d.f.slice(0, 4)))];
      const sec = document.createElement("section");
      const lv = ORDER.map((n) => { const b = r.by[n]; return `<tr><td><span class="nivel ${cls(n)}">${n}</span></td><td class="num">${num(b.dias)} (${pct(b.dias / r.dias)})</td><td class="num">${pct(b.dias ? b.con / b.dias : 0, 1)}</td><td class="num">${num(b.inc)}</td><td class="num">${num(b.ch)}</td><td class="num">${pct(r.total ? b.ch / r.total : 0)}</td></tr>`; }).join("");
      const worst = r.worst.map((d) => `<tr><td>${fecha(d.f)}</td><td><span class="nivel ${cls(d.n)}">${d.n}</span></td><td class="num">${pct(d.p, 1)}</td><td class="num">${d.i}</td><td class="num">${num(d.c)}</td><td class="num">${num(d.h)}</td><td class="num">${num(d.m)}</td><td>${esc(d.b || "")}</td></tr>`).join("");
      const ratio = r.by.bajo.dias && r.by["muy alto"].dias ? (r.by["muy alto"].con / r.by["muy alto"].dias) / (r.by.bajo.con / r.by.bajo.dias) : null;
      // The incidents per year over the days really scored: the first year with forecast starts on 20 January and the
      // last one ends with the labels of Calser, so they count as the part of a year they are.
      const incidents = days.reduce((a, d) => a + d.i, 0);
      const firstDay = days.reduce((m, d) => (d.f < m ? d.f : m), days[0].f), lastDay = days.reduce((m, d) => (d.f > m ? d.f : m), days[0].f);
      sec.innerHTML = `<h2>${esc(dist.nombre)}</h2>
        <div class="cifras">
          <div class="cifra"><div class="v">${pct(r.alertDays / r.dias)}</div><div class="l">de los días en alerta (alto o muy alto)</div></div>
          <div class="cifra"><div class="v">${pct(r.total ? r.alert / r.total : 0)}</div><div class="l">de las horas-cliente perdidas por causas locales cayeron en esos días</div></div>
          <div class="cifra"><div class="v">${ratio && isFinite(ratio) ? num(ratio, 1) : "-"}</div><div class="l">veces más probable una avería en un día muy alto que en uno bajo</div></div>
          <div class="cifra"><div class="v">${num(incidents)}</div><div class="l">incidencias de causa local del ${fecha(firstDay)} al ${fecha(lastDay)} (${num(incidents / (days.length / 365), 1)} al año)</div></div>
        </div>
        ${years.map((y) => `<div class="anio">${y}</div><div class="cal-caja">` + calendar(days.filter((d) => d.f.startsWith(y)), Number(y), winsor) + "</div>").join("")}
        <div class="leyenda"><span><i style="background:var(--cal-bajo)"></i>bajo</span><span><i style="background:var(--cal-medio)"></i>medio</span><span><i style="background:var(--cal-alto)"></i>alto</span><span><i style="background:var(--cal-muy-alto)"></i>muy alto</span><span><b class="dot"></b>avería ese día (tamaño: horas-cliente)</span><span><i style="background:transparent;border:1px solid var(--fg)"></i>aviso amarillo de AEMET</span><span><i style="background:transparent;border:2px solid var(--fg)"></i>naranja o rojo</span><span>color: nivel que habría dado el sistema la tarde anterior</span></div>
        <h3>Por nivel previsto</h3>
        <table><thead><tr><th>Nivel</th><th class="num">Días</th><th class="num">Con avería</th><th class="num">Incidencias</th><th class="num">Horas-cliente</th><th class="num">Parte</th></tr></thead><tbody>${lv}</tbody></table>
        <h3>Los 10 peores días</h3>
        <table><thead><tr><th>Día</th><th>Nivel previsto</th><th class="num">Prob.</th><th class="num">Incid.</th><th class="num">Clientes</th><th class="num">Horas-cliente</th><th class="num">Corte más largo (min)</th><th>Bases propuestas</th></tr></thead><tbody>${worst}</tbody></table>`;
      root.appendChild(sec);
      envolverTablas(sec);
      const tip = document.getElementById("tip");
      const byDate = new Map(days.map((d) => [d.f, d]));
      sec.querySelectorAll("rect.dia").forEach((el) => {
        el.addEventListener("mousemove", (e) => {
          const d = byDate.get(el.dataset.f);
          if (!d) return;
          tip.style.display = "block"; tip.style.left = (e.clientX + 12) + "px"; tip.style.top = (e.clientY + 12) + "px";
          const AVISO = ["sin aviso de AEMET", "aviso amarillo de AEMET", "aviso naranja de AEMET", "aviso rojo de AEMET"];
          tip.innerHTML = `<b>${fecha(d.f)}</b>: nivel ${esc(d.n)} (${pct(d.p, 1)})${d.a != null ? `, ${AVISO[d.a] || "aviso de AEMET"}` : ""}<br>${d.i ? `${d.i} incidencia${d.i > 1 ? "s" : ""}, ${num(d.c)} clientes, ${num(hours(d, winsor))} horas-cliente, corte más largo ${num(d.m)} min` : "sin averías de causa local"}${d.b ? `<br>bases: ${esc(d.b)}` : ""}`;
        });
        el.addEventListener("mouseleave", () => { tip.style.display = "none"; });
      });
    }
    const modeText = String((DATA.modos || {})[mode] || "");
    document.getElementById("fuentes").innerHTML = `${esc(modeText.charAt(0).toUpperCase() + modeText.slice(1))}. Niveles: muy alto desde el percentil 95 de los días de entrenamiento, alto desde el 90, medio desde el 75.`;
    document.getElementById("pie").textContent = "Cada día se puntúa con un modelo entrenado solo con los años anteriores, como hace el sistema cada tarde; las averías son las incidencias de causa local de Calser (sin aguas arriba, apagones, programadas ni maniobras) en los CT en estudio, con sus clientes y la duración real de cada corte. Generado el " + (DATA.generado || "") + ".";
  }

  document.querySelectorAll('input[name="modo"]').forEach((el) => el.addEventListener("change", render));
  document.getElementById("winsor").addEventListener("change", render);
  // The networks always in the same order, by name (Distribuidora 1, 2, 3), whatever the order of the JSON.
  function ordenar(lista) { return (lista || []).slice().sort((a, b) => String(a.nombre || "").localeCompare(String(b.nombre || ""), "es", { numeric: true })); }
  // The years of each kind of weather, as the file has them, next to its button.
  function anios() {
    for (const mode of ["prevision", "reanalisis"]) {
      const ys = DATA.distribuidoras.flatMap((x) => ((x.dias || {})[mode] || []).map((d) => String(d.f).slice(0, 4)));
      const el = document.getElementById("anios-" + mode);
      if (!el || !ys.length) continue;
      const lo = ys.reduce((a, b) => (a < b ? a : b)), hi = ys.reduce((a, b) => (a > b ? a : b));
      el.textContent = lo === hi ? lo : `${lo} - ${hi}`;
    }
  }
  fetch("data/historico.json", { cache: "no-store" }).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then((d) => { d.distribuidoras = ordenar(d.distribuidoras); DATA = d; anios(); render(); },
          (e) => { document.getElementById("fuentes").textContent = `Todavía no hay data/historico.json (${e.message}): lo deja job_ml_caso_negocio.py, el trabajo del caso de negocio.`; });
})();
</script>
</body>
</html>
