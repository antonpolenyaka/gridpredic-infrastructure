<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lo que habría dicho el sistema</title>
<style>
  /* Four years in one screen: a calendar per distribuidora and year with the level the system would have given
     the evening before (colour) and the incidents that happened (dots), from historico.json. */
  :root {
    --bg: #f6f7f4; --panel: #ffffff; --fg: #1d2230; --muted: #5d6675; --line: #d9ddd3; --accent: #1f5f8b;
    --bajo: #cfe3cf; --medio: #f0d98a; --alto: #ecb089; --muy-alto: #d9736f; --grid: #e6e8e2; --dot: #1d2230;
    --font: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #141720; --panel: #1d2130; --fg: #e7e9ee; --muted: #a2a9b8; --line: #2f3545;
      --accent: #7fb3dd; --grid: #2a3040; --bajo: #3d5a3d; --medio: #8a7a2a; --alto: #9a5a2a; --muy-alto: #a33a36; --dot: #ffffff;
      color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #141720; --panel: #1d2130; --fg: #e7e9ee; --muted: #a2a9b8; --line: #2f3545;
    --accent: #7fb3dd; --grid: #2a3040; --bajo: #3d5a3d; --medio: #8a7a2a; --alto: #9a5a2a; --muy-alto: #a33a36; --dot: #ffffff;
    color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--font); padding-block: 0 32px; }
  header { padding: 18px 24px 12px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; }
  header h1 { font-size: 22px; margin: 0; font-weight: 600; }
  header .fuentes { color: var(--muted); font-size: 13px; }
  header a { color: var(--accent); }
  main { padding: 0 24px; display: grid; gap: 20px; margin-top: 16px; }
  @media (max-width: 700px) { header, main { padding-left: 16px; padding-right: 16px; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 16px; }
  section h2 { margin: 0 0 10px; font-size: 18px; font-weight: 600; }
  h3 { margin: 14px 0 6px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .controles { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; font-size: 13px; }
  .controles label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  .cifras { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
  .cifra { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
  .cifra .v { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .cifra .l { color: var(--muted); font-size: 12px; }
  .anio { margin: 10px 0 2px; font-size: 13px; font-weight: 600; }
  .cal { display: block; width: 100%; height: auto; }
  .leyenda { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 12px; align-items: center; margin-top: 6px; }
  .leyenda i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  .leyenda b.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--dot); margin-right: 4px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .nivel { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; color: #fff; }
  .nivel.bajo { background: #7fb27f; } .nivel.medio { background: #e3b53a; color: #222; } .nivel.alto { background: #e0772f; } .nivel.muy-alto { background: #b8302f; }
  .tip { position: fixed; pointer-events: none; background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 8px; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.15); display: none; max-width: 320px; z-index: 5; }
  p.texto { margin: 6px 0; max-width: 80ch; }
  .notas { color: var(--muted); font-size: 13px; }
  footer { padding: 16px 24px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>Lo que habría dicho el sistema, día a día</h1>
  <div class="fuentes" id="fuentes">Cargando data/historico.json... <a href="index.html">Volver al riesgo de mañana</a></div>
</header>
<main id="main">
  <section>
    <div class="controles">
      <span>Tiempo del día que ve el modelo:</span>
      <label><input type="radio" name="modo" value="prevision" checked> previsión real de ICON-EU de la víspera (2024 - 2025)</label>
      <label><input type="radio" name="modo" value="reanalisis"> reanálisis, como previsión perfecta (2022 - 2025)</label>
      <label><input type="checkbox" id="winsor"> recortar los cortes de más de 110 minutos (el incendio de Jarilla del 13.08.2025 pesa solo lo que 4 años)</label>
    </div>
  </section>
  <div id="bloques"></div>
</main>
<div class="tip" id="tip"></div>
<footer id="pie"></footer>
<script>
(function () {
  "use strict";
  const COLORS = { bajo: "var(--bajo)", medio: "var(--medio)", alto: "var(--alto)", "muy alto": "var(--muy-alto)" };
  const ORDER = ["bajo", "medio", "alto", "muy alto"];
  const cls = (n) => (n || "bajo").replace(" ", "-");
  const num = (x, d = 0) => (x == null || isNaN(x)) ? "" : Number(x).toLocaleString("es-ES", { minimumFractionDigits: d, maximumFractionDigits: d });
  const pct = (x, d = 0) => (x == null || isNaN(x)) ? "" : (100 * x).toFixed(d).replace(".", ",") + " %";
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const fecha = (f) => f.slice(8, 10) + "." + f.slice(5, 7) + "." + f.slice(0, 4);
  const CAP = 110;
  let DATA = null;

  // The cut hours come from the job (chr: every CT cut capped at 110 min); older files only have the raw hours and the longest cut.
  function hours(d, winsor) { return winsor ? (d.chr != null ? d.chr : (d.m > CAP ? d.ch * CAP / d.m : d.ch)) : d.ch; }

  function resumen(days, winsor) {
    const by = {};
    for (const n of ORDER) by[n] = { dias: 0, con: 0, inc: 0, ch: 0 };
    let total = 0;
    for (const d of days) { const b = by[d.n] || by.bajo; b.dias++; if (d.i > 0) b.con++; b.inc += d.i; const h = hours(d, winsor); b.ch += h; total += h; }
    const alert = by.alto.ch + by["muy alto"].ch, alertDays = by.alto.dias + by["muy alto"].dias;
    const worst = days.filter((d) => d.i > 0).map((d) => ({ ...d, h: hours(d, winsor) })).sort((a, b) => b.h - a.h).slice(0, 10);
    return { by, total, alert, alertDays, worst, dias: days.length };
  }

  function calendar(days, year, winsor) {
    const W = 14, G = 2, L = 28, T = 16;
    const first = new Date(year + "-01-01T00:00:00Z"), last = new Date(year + "-12-31T00:00:00Z");
    const offset = (first.getUTCDay() + 6) % 7;
    const weeks = Math.ceil((offset + 366) / 7);
    const width = L + weeks * (W + G) + 4, height = T + 7 * (W + G) + 4;
    const byDate = new Map(days.map((d) => [d.f, d]));
    let out = `<svg class="cal" viewBox="0 0 ${width} ${height}" role="img" aria-label="Calendario de ${year}">`;
    const meses = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
    const dias = ["L", "", "X", "", "V", "", "D"];
    dias.forEach((t, i) => { if (t) out += `<text x="${L - 6}" y="${T + i * (W + G) + W - 3}" font-size="9" text-anchor="end" fill="var(--muted)">${t}</text>`; });
    let maxH = 1;
    for (const d of days) maxH = Math.max(maxH, hours(d, winsor));
    for (let t = new Date(first); t <= last; t.setUTCDate(t.getUTCDate() + 1)) {
      const f = t.toISOString().slice(0, 10);
      const idx = Math.floor((t - first) / 86400000) + offset;
      const col = Math.floor(idx / 7), row = idx % 7;
      const x = L + col * (W + G), y = T + row * (W + G);
      if (t.getUTCDate() === 1) out += `<text x="${x}" y="${T - 5}" font-size="9" fill="var(--muted)">${meses[t.getUTCMonth()]}</text>`;
      const d = byDate.get(f);
      const fill = d ? COLORS[d.n] || COLORS.bajo : "var(--grid)";
      out += `<rect x="${x}" y="${y}" width="${W}" height="${W}" rx="2" fill="${fill}" data-f="${f}" class="dia"></rect>`;
      if (d && d.i > 0) {
        const h = hours(d, winsor);
        const r = 1.6 + 4.4 * Math.sqrt(h / maxH);
        out += `<circle cx="${x + W / 2}" cy="${y + W / 2}" r="${r.toFixed(1)}" fill="var(--dot)" opacity="0.85" pointer-events="none"></circle>`;
      }
    }
    return out + "</svg>";
  }

  function render() {
    if (!DATA) return;
    const mode = document.querySelector('input[name="modo"]:checked').value;
    const winsor = document.getElementById("winsor").checked;
    const root = document.getElementById("bloques");
    root.innerHTML = "";
    for (const dist of DATA.distribuidoras) {
      const days = dist.dias[mode] || [];
      if (!days.length) continue;
      const r = resumen(days, winsor);
      const years = [...new Set(days.map((d) => d.f.slice(0, 4)))];
      const sec = document.createElement("section");
      const lv = ORDER.map((n) => { const b = r.by[n]; return `<tr><td><span class="nivel ${cls(n)}">${n}</span></td><td class="num">${num(b.dias)} (${pct(b.dias / r.dias)})</td><td class="num">${pct(b.dias ? b.con / b.dias : 0, 1)}</td><td class="num">${num(b.inc)}</td><td class="num">${num(b.ch)}</td><td class="num">${pct(r.total ? b.ch / r.total : 0)}</td></tr>`; }).join("");
      const worst = r.worst.map((d) => `<tr><td>${fecha(d.f)}</td><td><span class="nivel ${cls(d.n)}">${d.n}</span></td><td class="num">${pct(d.p, 1)}</td><td class="num">${d.i}</td><td class="num">${num(d.c)}</td><td class="num">${num(d.h)}</td><td class="num">${num(d.m)}</td><td>${esc(d.b || "")}</td></tr>`).join("");
      const ratio = r.by.bajo.dias && r.by["muy alto"].dias ? (r.by["muy alto"].con / r.by["muy alto"].dias) / (r.by.bajo.con / r.by.bajo.dias) : null;
      sec.innerHTML = `<h2>${esc(dist.nombre)}</h2>
        <div class="cifras">
          <div class="cifra"><div class="v">${pct(r.alertDays / r.dias)}</div><div class="l">de los días en alerta (alto o muy alto)</div></div>
          <div class="cifra"><div class="v">${pct(r.total ? r.alert / r.total : 0)}</div><div class="l">de las horas-cliente perdidas por causas locales cayeron en esos días</div></div>
          <div class="cifra"><div class="v">${ratio ? num(ratio, 1) + "x" : "-"}</div><div class="l">veces más probable una avería en un día muy alto que en uno bajo</div></div>
          <div class="cifra"><div class="v">${num(days.reduce((a, d) => a + d.i, 0))}</div><div class="l">incidencias de causa local en ${years.length} años (${num(days.reduce((a, d) => a + d.i, 0) / years.length, 1)} al año)</div></div>
        </div>
        ${years.map((y) => `<div class="anio">${y}</div>` + calendar(days.filter((d) => d.f.startsWith(y)), Number(y), winsor)).join("")}
        <div class="leyenda"><span><i style="background:var(--bajo)"></i>bajo</span><span><i style="background:var(--medio)"></i>medio</span><span><i style="background:var(--alto)"></i>alto</span><span><i style="background:var(--muy-alto)"></i>muy alto</span><span><b class="dot"></b>avería ese día (tamaño: horas-cliente)</span><span>color: nivel que habría dado el sistema la tarde anterior</span></div>
        <h3>Por nivel previsto</h3>
        <table><thead><tr><th>Nivel</th><th class="num">Días</th><th class="num">Con avería</th><th class="num">Incidencias</th><th class="num">Horas-cliente</th><th class="num">Parte</th></tr></thead><tbody>${lv}</tbody></table>
        <h3>Los 10 peores días</h3>
        <table><thead><tr><th>Día</th><th>Nivel previsto</th><th class="num">Prob.</th><th class="num">Incid.</th><th class="num">Clientes</th><th class="num">Horas-cliente</th><th class="num">Corte más largo (min)</th><th>Bases propuestas</th></tr></thead><tbody>${worst}</tbody></table>`;
      root.appendChild(sec);
      const tip = document.getElementById("tip");
      const byDate = new Map(days.map((d) => [d.f, d]));
      sec.querySelectorAll("rect.dia").forEach((el) => {
        el.addEventListener("mousemove", (e) => {
          const d = byDate.get(el.dataset.f);
          if (!d) return;
          tip.style.display = "block"; tip.style.left = (e.clientX + 12) + "px"; tip.style.top = (e.clientY + 12) + "px";
          tip.innerHTML = `<b>${fecha(d.f)}</b> · nivel ${esc(d.n)} (${pct(d.p, 1)})<br>${d.i ? `${d.i} incidencia${d.i > 1 ? "s" : ""}, ${num(d.c)} clientes, ${num(hours(d, winsor))} horas-cliente, corte más largo ${num(d.m)} min` : "sin averías de causa local"}${d.b ? `<br>bases: ${esc(d.b)}` : ""}`;
        });
        el.addEventListener("mouseleave", () => { tip.style.display = "none"; });
      });
    }
    document.getElementById("fuentes").innerHTML = `${esc(DATA.modos[mode])} · niveles: muy alto desde el percentil 95 de los días de entrenamiento, alto desde el 90, medio desde el 75 · <a href="index.html">Volver al riesgo de mañana</a>`;
    document.getElementById("pie").textContent = "Cada día se puntúa con un modelo entrenado solo con los años anteriores, como haría el job cada tarde; las averías son las incidencias de causa local de Calser (sin aguas arriba, apagones, programadas ni maniobras) en los CT en estudio, con sus clientes y la duración real de cada corte. Generado el " + (DATA.generado || "") + ".";
  }

  document.querySelectorAll('input[name="modo"]').forEach((el) => el.addEventListener("change", render));
  document.getElementById("winsor").addEventListener("change", render);
  fetch("data/historico.json", { cache: "no-store" }).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }).then((d) => { DATA = d; render(); })
    .catch((e) => { document.getElementById("fuentes").textContent = "No hay data/historico.json (lo deja job_ml_caso_negocio): " + e; });
})();
</script>
</body>
</html>
