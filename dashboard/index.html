<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riesgo de mañana</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
  /* Layout: a header with the day and the sources, one block per distribuidora (summary, map and zones side by
     side), then the hourly profile, causes, crews and the follow-up. */
  :root {
    --bg: #f6f7f4; --panel: #ffffff; --fg: #1d2230; --muted: #5d6675; --line: #d9ddd3; --accent: #1f5f8b;
    --bajo: #7fb27f; --medio: #e3b53a; --alto: #e0772f; --muy-alto: #b8302f; --grid: #e6e8e2;
    --font: "Segoe UI", "Helvetica Neue", Arial, sans-serif; --mono: Consolas, "Courier New", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #141720; --panel: #1d2130; --fg: #e7e9ee; --muted: #a2a9b8; --line: #2f3545;
      --accent: #7fb3dd; --grid: #2a3040; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #141720; --panel: #1d2130; --fg: #e7e9ee; --muted: #a2a9b8; --line: #2f3545;
    --accent: #7fb3dd; --grid: #2a3040; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--font); padding-block: 0 32px; }
  header { padding: 18px 24px 12px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px 24px;
    align-items: baseline; }
  header h1 { font-size: 22px; margin: 0; font-weight: 600; }
  header .fuentes { color: var(--muted); font-size: 13px; }
  main { padding: 0 24px; display: grid; gap: 20px; margin-top: 16px; }
  section.dist { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 16px; }
  section.dist h2 { margin: 0 0 10px; font-size: 18px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .nivel { display: inline-block; padding: 2px 10px; border-radius: 12px; color: #fff; font-size: 13px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .04em; }
  .nivel.tormenta-pill { background: #f1c40f; color: #222; } td.ahora .pico { color: #b8302f; font-weight: 600; }
  .nivel.bajo { background: var(--bajo); } .nivel.medio { background: var(--medio); color: #222; }
  .nivel.alto { background: var(--alto); } .nivel.muy-alto { background: var(--muy-alto); }
  .cols { display: grid; grid-template-columns: 1fr 1.3fr 1fr; gap: 16px; }
  @media (max-width: 1100px) { .cols { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 700px) { .cols { grid-template-columns: 1fr; } header, main { padding-left: 16px; padding-right: 16px; } }
  .cols > div { min-width: 0; }
  .cifras { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .cifra { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
  .cifra .v { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .cifra .l { color: var(--muted); font-size: 12px; }
  .map { height: 360px; border-radius: 6px; border: 1px solid var(--line); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .scroll { overflow: auto; max-height: 380px; }
  h3 { font-size: 14px; margin: 14px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  p.texto { margin: 6px 0; max-width: 70ch; }
  .perfil { width: 100%; height: 140px; display: block; }
  .leyenda { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 12px; align-items: center; }
  .leyenda i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
  .barra { display: flex; height: 18px; border-radius: 4px; overflow: hidden; border: 1px solid var(--line); }
  .barra span { display: block; height: 100%; }
  .notas { color: var(--muted); font-size: 13px; }
  .verificacion { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
  .notas li { margin: 2px 0; }
  .vacio { color: var(--muted); padding: 24px; text-align: center; border: 1px dashed var(--line); border-radius: 6px; }
  .zona-sel { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  tr.fila-zona { cursor: pointer; }
  details.cts { margin-top: 10px; }
  details.cts summary { cursor: pointer; color: var(--accent); font-size: 13px; }
  details.cts p.notas { max-width: 60ch; }
  .rayos { margin: 8px 0 4px; padding: 8px 10px; border-radius: 6px; font-size: 13px; border: 1px solid var(--line); background: var(--panel); }
  .vejez { margin: 12px 24px 0; border-color: #e0772f; background: rgba(224, 119, 47, 0.12); }
  .nivel.guardia-pill { background: var(--accent); }
  header .guardia { flex-basis: 100%; font-size: 14px; }
  header .guardia b { color: var(--accent); }
  .rayos.tormenta { border-color: #e3b53a; background: color-mix(in srgb, #e3b53a 18%, var(--panel)); }
  .rayos.cerca { border-color: #e3b53a; }
  .rayos b { font-weight: 600; }
  .brigada { font-size: 13px; }
  .brigada b { font-weight: 600; }
  .seguimiento .ok { color: var(--bajo); font-weight: 600; } .seguimiento .fallo { color: var(--muy-alto); font-weight: 600; }
  footer { padding: 16px 24px; color: var(--muted); font-size: 12px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1 id="titulo">Riesgo de mañana</h1>
  <div class="fuentes" id="fuentes">Cargando datos...</div>
  <div class="guardia" id="guardia" style="display:none"></div>
</header>
<main id="main"></main>
<footer id="pie"></footer>
<script src="vendor/leaflet/leaflet.js"></script>
<script>
(function () {
  "use strict";
  const COLORS = { bajo: "#7fb27f", medio: "#e3b53a", alto: "#e0772f", "muy alto": "#b8302f" };
  const cls = (nivel) => (nivel || "bajo").replace(" ", "-");
  const pct = (x, d = 1) => (x == null || isNaN(x)) ? "" : (100 * x).toFixed(d).replace(".", ",") + " %";
  const num = (x, d = 0) => (x == null || isNaN(x)) ? "" : Number(x).toFixed(d).replace(".", ",");
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function nivelPill(nivel) { return `<span class="nivel ${cls(nivel)}">${esc(nivel || "bajo")}</span>`; }

  function cabecera(data) {
    const f = data.fuentes || {};
    // The page lives all day: the evening before it is the risk of tomorrow, during the day it is the risk of today,
    // and when the run of the evening did not leave a new file it says so instead of looking current.
    const today = new Date(), local = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}-${String(today.getDate()).padStart(2, "0")}`;
    const diff = data.fecha ? Math.round((new Date(data.fecha + "T00:00:00") - new Date(local + "T00:00:00")) / 86400000) : 0;
    const cuando = diff === 1 ? "Riesgo de mañana" : diff === 0 ? "Riesgo de hoy" : "Riesgo del día";
    document.getElementById("titulo").textContent = cuando + ": " + (data.fecha_texto || data.fecha);
    let aviso = document.getElementById("vejez");
    if (!aviso) { aviso = document.createElement("div"); aviso.id = "vejez"; aviso.className = "rayos vejez"; document.getElementById("main").insertAdjacentElement("beforebegin", aviso); }
    if (DIA) {
      document.getElementById("titulo").textContent = "Riesgo del " + (data.fecha_texto || data.fecha) + ", visto la tarde anterior";
      aviso.innerHTML = `<b>Día repetido</b>: lo que el sistema habría dicho la tarde del día anterior con la previsión de ICON-EU y los avisos de AEMET que había entonces (${esc(DIA.slice(6, 8))}.${esc(DIA.slice(4, 6))}.${esc(DIA.slice(0, 4))}). Lo vivo (rayos, estaciones, próximas horas) no aplica a este día. <a href="index.html">Volver al riesgo de mañana</a>.`;
      aviso.style.display = "";
    } else if (diff < 0) {
      aviso.innerHTML = `<b>Este riesgo es del ${esc(data.fecha_texto || data.fecha)}</b>: la ejecución de anoche no ha dejado un riesgo nuevo. Mira dag_riesgo_manana en Airflow (http://localhost:8080) o lanza la tarea a mano.`;
      aviso.style.display = "";
    } else {
      aviso.style.display = "none";
    }
    // The guard of the day in one line: the distribuidoras to reinforce and why (alert, or a wind or thunderstorm warning).
    const guard = document.getElementById("guardia");
    const withGuard = (data.distribuidoras || []).filter((d) => d.guardia);
    if (guard && withGuard.length) {
      const reinforce = withGuard.filter((d) => d.guardia.reforzar), normal = withGuard.filter((d) => !d.guardia.reforzar);
      guard.innerHTML = (reinforce.length ? `<b>Guardia reforzada</b> en ${reinforce.map((d) => `${esc(d.nombre)} (${esc(d.guardia.motivo)})`).join(", ")}` : "<b>Guardia normal</b> en todas las redes")
        + (reinforce.length && normal.length ? `; normal en ${normal.map((d) => esc(d.nombre)).join(", ")}` : "") + ".";
      guard.style.display = "";
    } else if (guard) {
      guard.style.display = "none";
    }
    const partes = [];
    if (f.prevision_pedida) partes.push("Previsión de ICON-EU pedida el " + f.prevision_pedida);
    if (f.avisos_texto) partes.push(f.avisos_texto);
    if (f.calser_hasta) partes.push("Calser hasta el " + f.calser_hasta + (f.historia_al_dia ? "" : " (historia de incidencias no al día)"));
    if (data.modelo) partes.push(`Modelo ${data.modelo.descripcion || ""} entrenado con ${num(data.modelo.dias)} días de distribuidora hasta el ${data.modelo.entrenado_hasta}`);
    document.getElementById("fuentes").textContent = partes.join(" · ");
    fetch("data/historico.json", { method: "HEAD", cache: "no-store" }).then((r) => {
      if (r.ok) document.getElementById("fuentes").insertAdjacentHTML("beforeend", ' · <a href="historial.html">Lo que habría dicho el sistema desde 2022</a> · <a href="negocio.html">GridPredict en cifras</a>');
    }).catch(() => {});
    fetch("data/parte_guardia.xlsx", { method: "HEAD", cache: "no-store" }).then((r) => {
      if (r.ok) document.getElementById("fuentes").insertAdjacentHTML("beforeend", ' · <a href="data/parte_guardia.xlsx">Parte de guardia (Excel)</a>');
    }).catch(() => {});
    document.getElementById("pie").textContent = "Generado el " + (data.generado || "") + ". Mapa: OpenStreetMap (ODbL). " + (data.reglas && data.reglas.texto ? data.reglas.texto : "")
      + " Próximas 3 h por línea: regla sobre la probabilidad del día (el 84 % de las averías de los días de alerta de 2024 - 2026 empiezan en la franja; en el pico de racha, el 62 % de las averías por tiempo a menos de 3 h; rayos a menos de 10 km en la hora previa, 15 veces más averías): ordena las líneas para las próximas horas, no es una probabilidad calibrada.";
  }

  function perfilSvg(perfil, franja, observado, banda, aemet) {
    if (!perfil || !perfil.length) return '<div class="vacio">Sin perfil horario</div>';
    const W = 720, H = 140, L = 34, R = 8, T = 10, B = 24;
    const obs = (observado || []).filter((o) => o.racha_kmh != null);
    const ens = (banda || []).filter((e) => e.p10 != null && e.p90 != null);
    const aem = (aemet || []).filter((a) => a.racha_kmh != null);
    const max = Math.max(10, ...perfil.map((p) => p.racha_max || 0), ...obs.map((o) => o.racha_kmh), ...ens.map((e) => e.p90), ...aem.map((a) => a.racha_kmh));
    const x = (h) => L + (h / 24) * (W - L - R);
    const y = (v) => T + (1 - v / max) * (H - T - B);
    let out = `<svg class="perfil" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Racha prevista por horas">`;
    if (franja && franja.inicio != null) {
      out += `<rect x="${x(franja.inicio)}" y="${T}" width="${x(franja.fin + 1) - x(franja.inicio)}" height="${H - T - B}" fill="${COLORS.alto}" opacity="0.18"/>`;
    }
    for (const v of [max / 2, max]) {
      out += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/>`;
      out += `<text x="${L - 4}" y="${y(v) + 4}" font-size="10" text-anchor="end" fill="var(--muted)">${Math.round(v)}</text>`;
    }
    const bw = (W - L - R) / 24 - 2;
    for (const p of perfil) {
      const h = p.hora;
      out += `<rect x="${x(h) + 1}" y="${y(p.racha_max || 0)}" width="${bw}" height="${H - B - y(p.racha_max || 0)}" fill="var(--accent)" opacity="0.85"><title>${h}:00 racha máx. ${num(p.racha_max)} km/h, media ${num(p.racha_media)} km/h, lluvia ${num(p.lluvia, 1)} mm</title></rect>`;
      if (p.lluvia > 0) out += `<rect x="${x(h) + 1}" y="${H - B - Math.min(40, p.lluvia * 6)}" width="${bw}" height="${Math.min(40, p.lluvia * 6)}" fill="#3b82c4" opacity="0.5"/>`;
      if (h % 3 === 0) out += `<text x="${x(h) + bw / 2}" y="${H - 8}" font-size="10" text-anchor="middle" fill="var(--muted)">${h}h</text>`;
    }
    if (ens.length) {
      // The band of the ensemble: between the p10 and the p90 of the runs, with the median as a line.
      const up = ens.map((e) => `${(x(e.hora) + bw / 2).toFixed(1)},${y(e.p90).toFixed(1)}`);
      const down = ens.slice().reverse().map((e) => `${(x(e.hora) + bw / 2).toFixed(1)},${y(e.p10).toFixed(1)}`);
      out += `<polygon points="${up.concat(down).join(" ")}" fill="#6b4fbb" opacity="0.22"><title>escenarios de ICON-EU EPS: entre el p10 y el p90 de la racha</title></polygon>`;
      out += `<polyline points="${ens.map((e) => `${(x(e.hora) + bw / 2).toFixed(1)},${y(e.p50).toFixed(1)}`).join(" ")}" fill="none" stroke="#6b4fbb" stroke-width="1.5" stroke-dasharray="4 3"/>`;
    }
    if (aem.length) {
      // The forecast of AEMET by municipality (its own model): a green line, the strongest gust of the municipalities of the network.
      out += `<polyline points="${aem.map((a) => `${(x(a.hora) + bw / 2).toFixed(1)},${y(a.racha_kmh).toFixed(1)}`).join(" ")}" fill="none" stroke="#2e8b57" stroke-width="2"><title>AEMET por municipios: racha máxima prevista por horas</title></polyline>`;
    }
    if (obs.length) {
      const pts = obs.map((o) => `${(x(o.hora) + bw / 2).toFixed(1)},${y(o.racha_kmh).toFixed(1)}`).join(" ");
      out += `<polyline points="${pts}" fill="none" stroke="#b8302f" stroke-width="2"/>`;
      for (const o of obs) out += `<circle cx="${(x(o.hora) + bw / 2).toFixed(1)}" cy="${y(o.racha_kmh).toFixed(1)}" r="3" fill="#b8302f"><title>${o.hora}:00 observado: racha ${num(o.racha_kmh)} km/h${o.lluvia_mm != null ? ", lluvia " + num(o.lluvia_mm, 1) + " mm" : ""} (${o.estaciones} estaciones)</title></circle>`;
    }
    out += "</svg>";
    return out;
  }

  function causasBarra(causas) {
    if (!causas || !causas.length) return "";
    const palette = ["#1f5f8b", "#7fb27f", "#e3b53a", "#e0772f", "#b8302f", "#8e7cc3", "#9aa3b2"];
    let bar = '<div class="barra">', leg = '<div class="leyenda">';
    causas.forEach((c, i) => {
      bar += `<span style="width:${(100 * c.parte).toFixed(1)}%;background:${palette[i % palette.length]}" title="${esc(c.familia)} ${pct(c.parte, 0)}"></span>`;
      leg += `<span><i style="background:${palette[i % palette.length]}"></i>${esc(c.familia)} ${pct(c.parte, 0)}</span>`;
    });
    return bar + "</div>" + leg + "</div>";
  }

  function tablaZonas(d, idx) {
    const zonas = (d.zonas || []).slice().sort((a, b) => (b.probabilidad || 0) - (a.probabilidad || 0));
    if (!zonas.length) return '<div class="vacio">Sin zonas</div>';
    let rows = zonas.map((z, i) => {
      const inName = new Set(String(z.nombre || "").split(" / "));
      const more = (z.municipios || []).filter((m) => !inName.has(m));
      const extra = more.length ? `<br><span class="notas">y ${esc(more.slice(0, 3).join(", "))}${more.length > 3 ? " y " + (more.length - 3) + " más" : ""}</span>` : "";
      return `<tr class="fila-zona" data-dist="${idx}" data-zona="${i}" title="Línea ${esc(z.zona)}: ${num(z.hist_365d)} incidencias en el último año, la última hace ${num(z.hist_dias_desde)} días">
      <td>${esc(z.nombre)}${extra}</td>
      <td>${nivelPill(z.nivel)}</td><td class="num">${pct(z.probabilidad)}</td><td class="num">${pct(z.parte, 0)}</td>
      <td class="num">${num(z.n_ct)}</td><td class="num">${num(z.abonados)}</td><td class="num">${num(z.clientes_esperados, 1)}</td><td class="num">${num(z.racha_max)}</td>
      <td class="num">${num(z.hist_365d)}</td><td class="ahora" data-dist="${idx}" data-zona="${i}"></td><td class="num prox3" data-dist="${idx}" data-zona="${i}"></td></tr>`;
    }).join("");
    return `<div class="scroll"><table><thead><tr><th>Zona (línea)</th><th>Nivel</th><th class="num">Prob.</th><th class="num">Parte del riesgo</th><th class="num">CT</th><th class="num">Clientes</th><th class="num">Clientes esp.</th><th class="num">Racha (km/h)</th><th class="num">Inc. último año</th>${DIA ? "" : `<th>Ahora</th><th class="num" title="Regla con lo que hay en vivo sobre el riesgo del día: ver el pie de página">Próx. 3 h</th>`}</tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  // The risk of the next three hours of a line: a rule over the probability of the day. Inside the window of the
  // day the incidents concentrate (84 % of the incidents of the alert days of 2024 - 2026 start inside it); at the peak of the
  // gust, 62 % of the weather incidents start within 3 hours of it; flashes within 10 km in the previous hour
  // precede 17 % of the incidents against 1.1 % of the control windows (15 times). The constants are the ones
  // measured in causas-incidencias.md; the result ranks the lines for the next hours, it is not a calibrated
  // probability.
  const RULE = { enFranja: 0.84, enPico: 0.31, rayos: 15, tope: 0.95 };
  function nextHoursRisk(z, franja, hour, storm, atPeak) {
    const p = z.probabilidad || 0;
    if (!p) return 0;
    const inside = franja && franja.inicio != null && franja.fin != null;
    const span = inside ? Math.max(1, franja.fin - franja.inicio + 1) : 24;
    let base = 0;
    for (let k = 0; k < 3; k++) {
      const h = (hour + k) % 24;
      base += inside ? (h >= franja.inicio && h <= franja.fin ? RULE.enFranja * p / span : (1 - RULE.enFranja) * p / Math.max(1, 24 - span)) : p / 24;
    }
    if (atPeak) base = Math.max(base, RULE.enPico * p);
    if (storm) base *= RULE.rayos;
    return Math.min(RULE.tope, base);
  }

  // "Ahora" of every line, from what is live: the flashes of the satellite over its municipalities in the last
  // hour (rayos.json) and the last gust of the stations of AEMET within 25 km of them (observado.json), against
  // the gust forecast for the line.
  const VIVO = { rayos: null, observado: null };
  const haversine = (lat1, lon1, lat2, lon2) => {
    const r = Math.PI / 180, a = Math.sin((lat2 - lat1) * r / 2) ** 2 + Math.cos(lat1 * r) * Math.cos(lat2 * r) * Math.sin((lon2 - lon1) * r / 2) ** 2;
    return 2 * 6371 * Math.asin(Math.sqrt(a));
  };

  function pintarAhora(data) {
    const radius = (VIVO.observado && VIVO.observado.radio_km) || 25;
    (data.distribuidoras || []).forEach((d, idx) => {
      const zonas = (d.zonas || []).slice().sort((a, b) => (b.probabilidad || 0) - (a.probabilidad || 0));
      const storm = ((VIVO.rayos && VIVO.rayos.distribuidoras) || []).find((b) => String(b.id) === String(d.id));
      const lines = new Set((storm && storm.lineas) || []);
      const stations = ((VIVO.observado && VIVO.observado.fecha === data.fecha && VIVO.observado.estaciones) || []).filter((s) => s.racha_kmh != null);
      zonas.forEach((z, i) => {
        const cell = document.querySelector(`td.ahora[data-dist="${idx}"][data-zona="${i}"]`);
        if (!cell) return;
        const parts = [];
        if (lines.has(z.nombre)) parts.push('<span class="nivel tormenta-pill">rayos</span>');
        const places = (d.municipios || []).filter((m) => m.lat != null && (m.zonas || []).includes(z.nombre));
        let best = null;
        for (const st of stations) {
          if (places.some((m) => haversine(m.lat, m.lon, st.lat, st.lon) <= radius) && (best == null || st.racha_kmh > best.racha_kmh)) best = st;
        }
        let atPeak = false;
        if (best) {
          const hit = z.racha_max != null && best.racha_kmh >= z.racha_max;
          atPeak = z.racha_max != null && best.racha_kmh >= 0.9 * z.racha_max;
          parts.push(`<span${hit ? ' class="pico"' : ""} title="${esc(best.nombre)} a las ${esc(best.hora)}">${num(best.racha_kmh)} km/h${hit ? ", en el pico previsto" : ""}</span>`);
        }
        cell.innerHTML = parts.join(" ") || '<span class="notas">sin dato</span>';
        const next = document.querySelector(`td.prox3[data-dist="${idx}"][data-zona="${i}"]`);
        if (next) {
          const risk = nextHoursRisk(z, d.franja, new Date().getHours(), lines.has(z.nombre), atPeak);
          const why = [lines.has(z.nombre) ? "rayos a menos de 10 km en la última hora (x15)" : "", atPeak ? "racha medida en el pico previsto" : ""].filter(Boolean).join(", ");
          next.innerHTML = `<span${risk >= 0.05 ? ' class="pico"' : ""} title="${esc(why || "sin señal en vivo: solo el reparto del riesgo del día por horas")}">${pct(risk, 1)}</span>`;
        }
      });
    });
  }

  function tablaCts(d) {
    const cts = (d.cts || []).slice().sort((a, b) => (b.probabilidad || 0) - (a.probabilidad || 0)).slice(0, 10);
    if (!cts.length) return "";
    const rows = cts.map((c) => `<tr><td>${esc(c.ct_id)}</td><td>${esc(c.municipio || "")}</td><td class="num">${num(c.abonados)}</td><td class="num">${pct(c.probabilidad)}</td></tr>`).join("");
    return `<details class="cts"><summary>Los 10 CT con más probabilidad de corte</summary><div class="scroll"><table><thead><tr><th>CT</th><th>Municipio</th><th class="num">Clientes</th><th class="num">Prob.</th></tr></thead><tbody>${rows}</tbody></table></div>
      <p class="notas">La probabilidad de cada CT es la de su línea por la parte de las incidencias de la línea que lo cortan; dentro del día no sabemos qué línea romperá, así que sirve para ordenar, no para esperar la avería en ese CT.</p></details>`;
  }

  function brigadas(b) {
    if (!b || !b.bases || !b.bases.length) return "";
    const bases = b.bases.map((x) => `<li><b>${esc(x.municipio)}</b>: cubre ${num(x.cubre_ct)} CT (${pct(x.parte_riesgo, 0)} del riesgo), llegada media ${num(x.llegada_media_min)} min${x.llegada_max_min != null ? ", máxima " + num(x.llegada_max_min) : ""}` + (x.municipios && x.municipios.length ? `<br><span class="notas">cubre ${esc(x.municipios.slice(0, 8).join(", "))}${x.municipios.length > 8 ? " y " + (x.municipios.length - 8) + " más" : ""}</span>` : "") + "</li>").join("");
    const curve = (b.curva || []).map((c) => `${c.n}: ${num(c.llegada_media_min)} min`).join(" · ");
    return `<div class="brigada"><p class="texto">Con ${b.n} brigada${b.n > 1 ? "s" : ""}, las bases que minimizan la llegada al riesgo de mañana (tiempos: ${esc(b.tiempos || ("carretera a " + b.velocidad_kmh + " km/h"))}):</p><ul>${bases}</ul>
      <p class="texto">Llegada media ponderada por el riesgo: <b>${num(b.llegada_media_min)} min</b>; el ${pct(b.riesgo_30min, 0)} del riesgo a menos de 30 min y el ${pct(b.riesgo_45min, 0)} a menos de 45.${b.fijas ? " Con las bases fijas de la configuración: " + num(b.fijas.llegada_media_min) + " min." : ""}</p>
      ${b.posicionamiento ? `<p class="texto"><b>Posicionamiento:</b> ${esc(b.posicionamiento)}.</p>` : ""}
      ${curve ? `<p class="notas">Llegada media según el número de brigadas: ${esc(curve)}.</p>` : ""}</div>`;
  }

  function mapa(d, idx, el) {
    const map = L.map(el, { scrollWheelZoom: false });
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 18, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' }).addTo(map);
    const pts = [];
    const muni = d.municipios || [];
    for (const m of muni) {
      if (m.lat == null) continue;
      const r = 4 + Math.sqrt(m.n_ct || 1) * 1.6;
      const c = L.circleMarker([m.lat, m.lon], { radius: r, color: "#333", weight: 0.6, fillColor: COLORS[m.nivel] || COLORS.bajo, fillOpacity: 0.75 });
      c.bindTooltip(`<b>${esc(m.nombre)}</b><br>${num(m.n_ct)} CT, ${num(m.abonados)} clientes<br>Probabilidad de corte: ${pct(m.probabilidad)}<br>Racha prevista ${num(m.racha_max)} km/h` + (m.zonas ? "<br>Zonas: " + esc(m.zonas.join(", ")) : ""));
      c.addTo(map); pts.push([m.lat, m.lon]); m._marker = c;
    }
    for (const b of ((d.brigadas || {}).bases || [])) {
      if (b.lat == null) continue;
      L.marker([b.lat, b.lon], { title: "Base de brigada: " + b.municipio }).addTo(map).bindTooltip("Brigada: " + esc(b.municipio));
    }
    if (pts.length) map.fitBounds(pts, { padding: [16, 16], maxZoom: 11 }); else map.setView([39.5, -6.3], 8);
    return map;
  }

  // Lightning of the last hour (rayos.json, dag_rayos_vivo every 15 minutes): a banner per distribuidora and the
  // flashes on its map, the older ones paler. Optional: without the file nothing is shown.
  const maps = {};
  function pintarRayos(data, r) {
    VIVO.rayos = r;
    pintarAhora(data);
    const hora = r.generado ? r.generado.slice(11, 16) + " UTC" : "";
    (data.distribuidoras || []).forEach((d, idx) => {
      const block = (r.distribuidoras || []).find((b) => String(b.id) === String(d.id)) || null;
      const sec = document.getElementById("dist-" + idx);
      if (!sec) return;
      const level = block ? block.nivel : "sin tormenta";
      const klass = level === "tormenta sobre la red" ? "tormenta" : (level === "tormenta cerca" ? "cerca" : "");
      const text = block ? block.texto : `sin rayos en la caja de estudio en la última hora (${r.n_rayos || 0} en total)`;
      let banner = sec.querySelector(".rayos");
      if (!banner) { banner = document.createElement("div"); banner.className = "rayos"; sec.querySelector("h2").insertAdjacentElement("afterend", banner); }
      banner.className = "rayos " + klass;
      banner.innerHTML = `<b>Rayos ahora</b> (satélite MTG, actualizado a las ${esc(hora)}): ${esc(text)}.` + (block && block.municipios && block.municipios.length ? ` Municipios bajo la tormenta: ${esc(block.municipios.slice(0, 6).join(", "))}${block.municipios.length > 6 ? ", ..." : ""}.` : "");
      const map = maps[idx];
      if (!map) return;
      if (map._rayos) map._rayos.remove();
      const layer = L.layerGroup();
      for (const f of (r.rayos || [])) {
        const age = Math.min(1, Math.max(0, (f.minutos || 0) / Math.max(1, r.ventana_min || 60)));
        L.circleMarker([f.lat, f.lon], { radius: 4, color: "#8a6d00", weight: 0.5, fillColor: "#f1c40f", fillOpacity: 0.95 - 0.7 * age })
          .bindTooltip(`Rayo hace ${f.minutos} min (${esc(f.ts)})`).addTo(layer);
      }
      layer.addTo(map); map._rayos = layer;
    });
    const pie = document.getElementById("pie");
    if (r.regla && !pie.textContent.includes("rayos")) pie.textContent += " Rayos: " + r.fuente + ". " + r.regla;
  }

  // Observations of the stations of AEMET (observado.json, dag_observacion_vivo every hour): the gust measured
  // hour by hour over the forecast profile of the same day, and the stations on the map.
  function pintarObservado(data, o) {
    if (!o || o.fecha !== data.fecha) return;
    VIVO.observado = o;
    pintarAhora(data);
    (data.distribuidoras || []).forEach((d, idx) => {
      const block = (o.distribuidoras || []).find((b) => String(b.id) === String(d.id));
      const sec = document.getElementById("dist-" + idx);
      if (!sec || !block) return;
      if (block.horas && block.horas.length) {
        d._observado = block.horas;
        redibujarPerfil(d, idx);
        const title = sec.querySelector(".perfil-titulo");
        if (title) title.textContent = `Hoy: racha prevista por horas (barras, km/h; azul: lluvia) y observada por las estaciones de AEMET (rojo, hasta las ${esc(o.generado.slice(11, 16))} UTC)`;
      }
      const map = maps[idx];
      if (!map || map._estaciones) return;
      const layer = L.layerGroup();
      for (const st of (o.estaciones || [])) {
        L.circleMarker([st.lat, st.lon], { radius: 5, color: "#b8302f", weight: 1, fillColor: "#fff", fillOpacity: 0.9 })
          .bindTooltip(`Estación AEMET ${esc(st.nombre)} (${esc(st.hora)}): racha ${num(st.racha_kmh)} km/h, viento ${num(st.viento_kmh)} km/h${st.lluvia_mm != null ? ", lluvia " + num(st.lluvia_mm, 1) + " mm" : ""}${st.temp_c != null ? ", " + num(st.temp_c, 1) + " °C" : ""}`).addTo(layer);
      }
      layer.addTo(map); map._estaciones = layer;
    });
  }

  function redibujarPerfil(d, idx) {
    const sec = document.getElementById("dist-" + idx);
    const holder = sec && sec.querySelector(".perfil-holder");
    if (holder) holder.innerHTML = perfilSvg(d.perfil, d.franja || {}, d._observado, d._banda, d._aemet);
  }

  // The forecast of AEMET by municipality (aemet.json, task aemet_municipios of dag_riesgo_manana): the green line
  // over the profile and its sentence.
  function pintarAemet(data, a) {
    if (!a || a.fecha !== data.fecha) return;
    (data.distribuidoras || []).forEach((d, idx) => {
      const block = (a.distribuidoras || []).find((b) => String(b.id) === String(d.id));
      const sec = document.getElementById("dist-" + idx);
      if (!sec || !block || !block.horas || !block.horas.length) return;
      d._aemet = block.horas;
      redibujarPerfil(d, idx);
      let p = sec.querySelector(".aemet");
      if (!p) {
        p = document.createElement("p");
        p.className = "verificacion aemet";
        const holder = sec.querySelector(".perfil-holder");
        if (holder && holder.parentNode) holder.parentNode.insertBefore(p, holder.nextSibling); else sec.appendChild(p);
      }
      p.textContent = "Línea verde: " + (block.texto || "AEMET por municipios") + ".";
      d._picoAemet = block.pico;
      pintarConfianza(d, idx);
    });
  }

  // How much to trust the forecast of the day: a rule on the agreement of the three sources about the peak gust of
  // the network. ICON-EU (the bars) and AEMET by municipality agree when their peaks differ by 15 km/h or less;
  // the 40 runs agree when the p10 - p90 of their peak spans 30 km/h or less. Both: alta; one: media; none: baja.
  function pintarConfianza(d, idx) {
    const sec = document.getElementById("dist-" + idx);
    if (!sec) return;
    const peakIcon = (d.franja || {}).racha_pico != null ? d.franja.racha_pico : Math.max(0, ...(d.perfil || []).map((p) => p.racha_max || 0));
    const aemet = d._picoAemet && d._picoAemet.racha_kmh != null ? d._picoAemet.racha_kmh : null;
    const band = d._picoBanda && d._picoBanda.p10 != null && d._picoBanda.p90 != null ? d._picoBanda : null;
    if (aemet == null && !band) return;
    const parts = [];
    let points = 0, of = 0;
    if (aemet != null) {
      of++;
      const agree = Math.abs(peakIcon - aemet) <= 15;
      points += agree ? 1 : 0;
      parts.push(agree ? `ICON-EU y AEMET coinciden en el pico (${num(peakIcon)} y ${num(aemet)} km/h)` : `ICON-EU y AEMET no coinciden en el pico (${num(peakIcon)} frente a ${num(aemet)} km/h)`);
    }
    if (band) {
      of++;
      const agree = band.p90 - band.p10 <= 30;
      points += agree ? 1 : 0;
      parts.push(agree ? `los escenarios están de acuerdo (pico entre ${num(band.p10)} y ${num(band.p90)})` : `los escenarios están repartidos (pico entre ${num(band.p10)} y ${num(band.p90)})`);
    }
    const label = points === of ? "alta" : points > 0 ? "media" : "baja";
    let p = sec.querySelector(".confianza");
    if (!p) {
      p = document.createElement("p");
      p.className = "verificacion confianza";
      const holder = sec.querySelector(".perfil-holder");
      if (holder && holder.parentNode) holder.parentNode.insertBefore(p, holder.nextSibling); else sec.appendChild(p);
    }
    p.innerHTML = `<b>Confianza en la previsión del viento: ${label}</b> (${esc(parts.join("; "))}).`;
  }

  // The ensemble of ICON-EU EPS (ensemble.json, task ensemble of dag_riesgo_manana): the band between the p10 and
  // the p90 of the runs over the profile and a sentence with the spread of the peak of the day.
  function pintarEnsemble(data, e) {
    if (!e || e.fecha !== data.fecha) return;
    (data.distribuidoras || []).forEach((d, idx) => {
      const block = (e.distribuidoras || []).find((b) => String(b.id) === String(d.id));
      const sec = document.getElementById("dist-" + idx);
      if (!sec || !block || !block.horas || !block.horas.length) return;
      d._banda = block.horas;
      redibujarPerfil(d, idx);
      let p = sec.querySelector(".ensemble");
      if (!p) {
        p = document.createElement("p");
        p.className = "verificacion ensemble";
        const holder = sec.querySelector(".perfil-holder");
        if (holder && holder.parentNode) holder.parentNode.insertBefore(p, holder.nextSibling); else sec.appendChild(p);
      }
      p.textContent = "Banda morada: " + (block.texto || "escenarios de ICON-EU EPS") + ".";
      d._picoBanda = block.pico;
      pintarConfianza(d, idx);
    });
  }

  function cargarObservado(data) {
    const suffix = DIA.length === 8 ? `_${DIA}` : "";
    if (!suffix) fetch("data/observado.json", { cache: "no-store" }).then((x) => { if (!x.ok) throw new Error(x.status); return x.json(); })
      .then((o) => pintarObservado(data, o)).catch(() => {});
    fetch(`data/ensemble${suffix}.json`, { cache: "no-store" }).then((x) => { if (!x.ok) throw new Error(x.status); return x.json(); })
      .then((e) => pintarEnsemble(data, e)).catch(() => {});
    fetch(`data/aemet${suffix}.json`, { cache: "no-store" }).then((x) => { if (!x.ok) throw new Error(x.status); return x.json(); })
      .then((a) => pintarAemet(data, a)).catch(() => {});
    if (!suffix) fetch("data/verificacion.json", { cache: "no-store" }).then((x) => { if (!x.ok) throw new Error(x.status); return x.json(); })
      .then((v) => pintarVerificacion(data, v)).catch(() => {});
    if (!suffix) fetch("data/avisos_hoy.json", { cache: "no-store" }).then((x) => { if (!x.ok) throw new Error(x.status); return x.json(); })
      .then((a) => pintarAvisosHoy(data, a)).catch(() => {});
  }

  // The warnings of AEMET read during the day (avisos_hoy.json, task avisos_hoy of dag_observacion_vivo): the guard
  // line of the header and the pill of every distribuidora follow the warnings that arrived after the evening run.
  function pintarAvisosHoy(data, a) {
    if (!a || a.fecha !== data.fecha || !(a.distribuidoras || []).length) return;
    const byId = Object.fromEntries(a.distribuidoras.map((d) => [String(d.id), d]));
    const guard = document.getElementById("guardia");
    const changed = a.distribuidoras.filter((d) => d.subida || (d.nuevos || []).length);
    (data.distribuidoras || []).forEach((d, idx) => {
      const today = byId[String(d.id)];
      if (!today || !today.subida) return;
      const h2 = document.querySelector(`#dist-${idx} h2`);
      if (h2 && !h2.querySelector(".guardia-pill")) {
        h2.querySelector(".nivel").insertAdjacentHTML("afterend", ` <span class="nivel guardia-pill" title="${esc(today.guardia.motivo || "")}">guardia reforzada</span>`);
      }
    });
    if (guard && changed.length) {
      guard.insertAdjacentHTML("beforeend", ` <span class="notas">Avisos de AEMET leídos durante el día (${esc((a.generado || "").slice(11, 16))} UTC): ${changed.map((d) => esc(d.texto)).join("; ")}.</span>`);
      guard.style.display = "";
    }
  }

  // What the forecast of the evening before was worth (verificacion.json, written with the observations): yesterday's
  // forecast peak against the measured one and the summary of the last complete days.
  // The log of the last days (verificacion.json): what the system said every evening and what the stations
  // measured, one row per day, so the page shows its own record while it runs.
  function pintarDiario(data, v) {
    const days = Object.keys(v.dias || {}).sort().reverse().slice(0, 21);
    if (!days.length) return;
    let sec = document.getElementById("diario");
    if (!sec) {
      sec = document.createElement("section");
      sec.id = "diario";
      document.getElementById("main").appendChild(sec);
    }
    const dists = data.distribuidoras || [];
    let html = `<h2>Lo que dijimos cada tarde y lo que pasó con el viento (últimos ${days.length} días)</h2>
      <p class="notas">Por distribuidora: el nivel de la víspera (y el aviso de AEMET que había para el día), el pico de racha previsto y el medido por las estaciones de AEMET a menos de ${num(v.radio_km || 25)} km de la red (hora del pico medido). Las averías de cada día llegan con la carga de Calser y se ven en el historial.</p>
      <table><thead><tr><th>día</th>${dists.map((d) => `<th>${esc(d.nombre)}</th>`).join("")}</tr></thead><tbody>`;
    for (const f of days) {
      const recs = v.dias[f] || [];
      html += `<tr><td>${f.slice(8, 10)}.${f.slice(5, 7)}.${f.slice(0, 4)}</td>`;
      for (const d of dists) {
        const r = recs.find((x) => String(x.id) === String(d.id));
        if (!r) { html += "<td></td>"; continue; }
        const AVISO = ["", "aviso amarillo", "aviso naranja", "aviso rojo"];
        const level = (r.nivel ? `<span class="nivel ${cls(r.nivel)}">${r.nivel}</span>` : "") + (r.aviso_aemet ? ` <span class="notas">(${AVISO[r.aviso_aemet] || "aviso"} de AEMET)</span>` : "");
        const forecast = r.racha_prevista_max != null ? `${num(r.racha_prevista_max)}` : "-";
        const observed = r.racha_observada_max != null ? `${num(r.racha_observada_max)} km/h a las ${r.hora_observada}:00` : "sin estaciones";
        const marks = [r.pico_en_franja === true ? "en la franja" : r.pico_en_franja === false ? "fuera de la franja" : "",
                       r.pico_en_banda === true ? "en la banda" : r.pico_en_banda === false ? "fuera de la banda" : ""].filter(Boolean).join(", ");
        html += `<td>${level} previsto ${forecast}, medido ${observed}${marks ? " (" + marks + ")" : ""}</td>`;
      }
      html += "</tr>";
    }
    sec.innerHTML = html + "</tbody></table>";
  }

  function pintarVerificacion(data, v) {
    if (!v) return;
    pintarDiario(data, v);
    (data.distribuidoras || []).forEach((d, idx) => {
      const sec = document.getElementById("dist-" + idx);
      if (!sec) return;
      const ayer = ((v.ayer || {}).distribuidoras || []).find((b) => String(b.id) === String(d.id));
      const resumen = (v.resumen || []).find((b) => String(b.id) === String(d.id));
      const parts = [];
      if (ayer && ayer.racha_prevista_max != null && ayer.racha_observada_max != null) {
        parts.push(`Ayer (${fechaCorta(v.ayer.fecha)}): previsto un pico de ${num(ayer.racha_prevista_max)} km/h a las ${ayer.hora_prevista}:00, observado ${num(ayer.racha_observada_max)} km/h a las ${ayer.hora_observada}:00 (${ayer.estaciones} estaciones${ayer.pico_en_franja == null ? "" : ayer.pico_en_franja ? ", dentro de la franja prevista" : ", fuera de la franja prevista"}).`);
      } else if (ayer && ayer.racha_prevista_max != null && ayer.estaciones === 0) {
        parts.push(`Ayer (${fechaCorta(v.ayer.fecha)}): sin estaciones de AEMET a menos de ${num(data.radio_km || 25)} km de la red para comprobar la previsión.`);
      }
      if (resumen && resumen.texto) parts.push(resumen.texto.charAt(0).toUpperCase() + resumen.texto.slice(1) + ".");
      if (!parts.length) return;
      let p = sec.querySelector(".verificacion");
      if (!p) {
        p = document.createElement("p");
        p.className = "verificacion";
        const holder = sec.querySelector(".perfil-holder");
        if (holder && holder.parentNode) holder.parentNode.insertBefore(p, holder.nextSibling); else sec.appendChild(p);
      }
      p.textContent = "Lo que valió la previsión. " + parts.join(" ");
    });
  }

  function fechaCorta(f) { return f && f.length >= 10 ? f.slice(8, 10) + "." + f.slice(5, 7) : f || ""; }

  function cargarRayos(data) {
    if (DIA) return;
    fetch("data/rayos.json", { cache: "no-store" }).then((x) => { if (!x.ok) throw new Error(x.status); return x.json(); })
      .then((r) => pintarRayos(data, r)).catch(() => {});
  }

  function seguimiento(s) {
    if (!s || !s.dias || !s.dias.length) return "";
    const r = s.resumen || {};
    let rows = s.dias.slice(-30).reverse().map((x) => `<tr><td>${esc(x.fecha)}</td><td>${esc(x.distribuidora)}</td><td>${nivelPill(x.nivel)}</td><td class="num">${pct(x.probabilidad)}</td><td>${x.averias == null ? "<span class='notas'>sin datos aún</span>" : (x.averias > 0 ? "<span class='fallo'>" + x.averias + " avería" + (x.averias > 1 ? "s" : "") + "</span>" : "<span class='ok'>sin averías</span>")}</td></tr>`).join("");
    return `<section class="dist seguimiento"><h2>Seguimiento de las predicciones</h2>
      <p class="texto">${r.dias_con_resultado ? `De los ${r.dias_con_resultado} días ya contrastados con Calser, hubo avería en ${r.dias_con_averia}. En los días marcados alto o muy alto hubo avería el ${pct(r.acierto_alto, 0)} de las veces; en los marcados bajo, el ${pct(r.averia_en_bajo, 0)}.` : "Todavía no hay días contrastados con las incidencias de Calser."}</p>
      <div class="scroll"><table><thead><tr><th>Día</th><th>Distribuidora</th><th>Nivel previsto</th><th class="num">Prob.</th><th>Qué pasó</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
  }

  function render(data) {
    cabecera(data);
    const main = document.getElementById("main");
    main.innerHTML = "";
    (data.distribuidoras || []).forEach((d, idx) => {
      const sec = document.createElement("section");
      sec.className = "dist";
      sec.id = "dist-" + idx;
      const imp = d.impacto || {}, fr = d.franja || {};
      const guardia = d.guardia && d.guardia.reforzar ? `<span class="nivel guardia-pill" title="${esc(d.guardia.motivo || "")}">guardia reforzada</span>` : "";
      sec.innerHTML = `<h2>${esc(d.nombre)} ${nivelPill(d.nivel)} ${guardia} <span class="notas">${esc(d.motivos || "")}</span>${d.guardia && d.guardia.reforzar ? `<span class="notas"> · guardia: ${esc(d.guardia.motivo || "")}</span>` : ""}</h2>
        <div class="cols">
          <div>
            <div class="cifras">
              <div class="cifra"><div class="v">${pct(d.probabilidad)}</div><div class="l">probabilidad de alguna interrupción (${num(d.veces_tasa_base, 1)} veces su tasa base, percentil ${num(100 * d.percentil)})</div></div>
              <div class="cifra"><div class="v">${num(d.esperadas, 2)}</div><div class="l">averías esperadas</div></div>
              <div class="cifra"><div class="v">${num(imp.clientes_esperados)}</div><div class="l">clientes esperados sin luz (${num(imp.ct_esperados, 1)} CT, ${num(imp.kva_esperados)} kVA)</div></div>
              <div class="cifra"><div class="v">${fr.inicio != null ? fr.inicio + "-" + (fr.fin + 1) + " h" : "-"}</div><div class="l">franja de más riesgo (pico de racha a las ${fr.pico != null ? fr.pico + " h" : "-"}, ${num(fr.racha_pico)} km/h)</div></div>
            </div>
            <h3>Si hay avería, por qué</h3>${causasBarra(d.causas)}
            <h3>Brigadas</h3>${brigadas(d.brigadas)}
          </div>
          <div><div class="map" id="map-${idx}"></div>
            <div class="leyenda" style="margin-top:6px"><span><i style="background:${COLORS.bajo}"></i>bajo</span><span><i style="background:${COLORS.medio}"></i>medio</span><span><i style="background:${COLORS.alto}"></i>alto</span><span><i style="background:${COLORS["muy alto"]}"></i>muy alto</span><span>círculo: municipio, tamaño por CT</span><span>marcador: base de brigada</span><span>círculo blanco: estación de AEMET</span></div>
            <h3 class="perfil-titulo">Perfil de mañana (racha máxima prevista por horas, km/h; azul: lluvia)</h3><div class="perfil-holder">${perfilSvg(d.perfil, fr)}</div>
          </div>
          <div><h3>Zonas (líneas) por riesgo</h3>${tablaZonas(d, idx)}${tablaCts(d)}</div>
        </div>`;
      main.appendChild(sec);
      const map = mapa(d, idx, sec.querySelector("#map-" + idx));
      maps[idx] = map;
      sec.querySelectorAll("tr.fila-zona").forEach((tr) => tr.addEventListener("click", () => {
        sec.querySelectorAll("tr.fila-zona").forEach((o) => o.classList.remove("zona-sel"));
        tr.classList.add("zona-sel");
        const z = (d.zonas || []).slice().sort((a, b) => (b.probabilidad || 0) - (a.probabilidad || 0))[Number(tr.dataset.zona)];
        const set = new Set(z.municipios || []);
        for (const m of (d.municipios || [])) if (m._marker) m._marker.setStyle({ weight: set.has(m.nombre) ? 3 : 0.6, color: set.has(m.nombre) ? "#1f5f8b" : "#333" });
      }));
    });
    const seg = seguimiento(data.seguimiento);
    if (seg) main.insertAdjacentHTML("beforeend", seg);
    if (data.notas && data.notas.length) main.insertAdjacentHTML("beforeend", `<section class="dist"><h2>Notas</h2><ul class="notas">${data.notas.map((n) => "<li>" + esc(n) + "</li>").join("")}</ul></section>`);
    cargarRayos(data);
    cargarObservado(data);
    setInterval(() => { cargarRayos(data); cargarObservado(data); }, 5 * 60 * 1000);
  }

  // ?dia=YYYYMMDD shows an archived or replayed day (riesgo_<dia>.json, with its ensemble and AEMET files when they exist).
  const DIA = (new URLSearchParams(location.search).get("dia") || "").replace(/[^0-9]/g, "").slice(0, 8);
  const RIESGO = DIA.length === 8 ? `data/riesgo_${DIA}.json` : "data/riesgo.json";
  fetch(RIESGO, { cache: "no-store" }).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(render)
    .catch((e) => { document.getElementById("fuentes").textContent = `No hay datos todavía (${RIESGO}): ` + e; });
})();
</script>
</body>
</html>
