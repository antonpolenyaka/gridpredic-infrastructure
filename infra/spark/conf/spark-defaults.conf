# Dependencies
spark.jars.packages io.delta:delta-spark_2.13:4.4.0,org.apache.spark:spark-sql-kafka-0-10_2.13:4.2.0,com.microsoft.sqlserver:mssql-jdbc:13.4.0.jre11,org.apache.hadoop:hadoop-aws:3.5.0

# Spark cluster
spark.master spark://spark-master:7077

# Delta Lake
spark.sql.extensions io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog org.apache.spark.sql.delta.catalog.DeltaCatalog

# Time zone. SQL Server keeps local wall-clock times without zone and Bronze copies them as they are: the JDBC
# reader turns them into instants with the zone of the JVM and Debezium sends them as if they were UTC. Both
# paths only agree when the JVM and the session are in UTC, which is what the containers use today (no TZ);
# fixing it here keeps a driver started elsewhere from shifting the hours. Gold and the ML jobs set it too.
spark.sql.session.timeZone UTC
spark.driver.extraJavaOptions -Duser.timezone=UTC
spark.executor.extraJavaOptions -Duser.timezone=UTC

# Faster toPandas() in Silver and Gold (the ML jobs already set it in config_ml.json)
spark.sql.execution.arrow.pyspark.enabled true

# Hive Metastore
spark.sql.catalogImplementation hive
spark.hadoop.hive.metastore.uris thrift://hive:9083
spark.sql.hive.metastore.version 4.1.0
spark.sql.hive.metastore.jars maven

# MinIO / S3A
spark.hadoop.fs.s3a.endpoint http://minio:9000
spark.hadoop.fs.s3a.path.style.access true
spark.hadoop.fs.s3a.connection.ssl.enabled false

# Spark History Server
spark.eventLog.enabled true
spark.eventLog.dir s3a://spark-events/
spark.history.fs.logDirectory s3a://spark-events/